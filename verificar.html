<!doctype html><meta charset="utf-8"><title>Verificação</title><iframe src="index.html" width="1400" height="900"></iframe><pre id="result">PENDENTE</pre><script>
document.querySelector('iframe').onload=()=>{try{const w=document.querySelector('iframe').contentWindow,d=w.document,click=id=>d.getElementById(id).click(),check=(v,s)=>{if(!v)throw Error(s);};check(d.querySelectorAll('.layer').length===4,'Camadas iniciais');click('add');check(d.querySelectorAll('.layer').length===5,'Adicionar');click('undo');check(d.querySelectorAll('.layer').length===4,'Desfazer');click('redo');check(d.querySelectorAll('.layer').length===5,'Refazer');d.querySelector('.layer button').click();check(d.querySelector('.layer button').textContent==='○','Visibilidade');click('undo');check(d.querySelector('.layer button').textContent==='◉','Restaurar visibilidade');click('plus');check(d.getElementById('zoom').textContent!=='100%','Zoom');d.querySelector('[data-tool="brush"]').click();check(d.getElementById('toolName').textContent==='Terreno','Selecionar ferramenta');check(d.getElementById('map').toDataURL().length>1000,'Renderizar mapa');document.getElementById('result').textContent='PASSOU: inicialização, camadas, desfazer/refazer, visibilidade, zoom, ferramentas e renderização.';}catch(e){document.getElementById('result').textContent='FALHOU: '+e.message;}};
</script>
