<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Catálogo de arquiteturas 3D</title>
<style>*{box-sizing:border-box}body{margin:0;padding:28px;background:#18252c;color:#e9e5d9;font:14px system-ui}h1{font-size:25px;margin:0 0 6px}p{color:#aabcc2;margin:0 0 20px}.row{display:grid;grid-template-columns:120px repeat(3,1fr);gap:14px;margin:12px 0;align-items:center}.row h2{font-size:16px}.card{background:#22333a;border:1px solid #42555c;border-radius:14px;text-align:center;padding:12px}.card canvas{width:100%;height:170px;object-fit:contain}.card strong{display:block;font-size:13px}select{background:#22333a;color:#fff;padding:8px;border:1px solid #60767d;border-radius:6px}</style>
<h1>Arquiteturas do Atlas</h1><p>Três formas por construção · miniaturas da malha real</p><label>Cores <select id="palette"><option value="-1">Padrão de cada arquitetura</option><option value="0">Terracota e marfim</option><option value="1">Ardósia e prata</option><option value="2">Jade e arenito</option></select></label><main></main>
<script src="../buildings-3d.js"></script><script>
const names={house:'Casa',village:'Vila',tower:'Torre',castle:'Castelo',temple:'Templo',camp:'Acampamento',ruin:'Ruínas',windmill:'Moinho',tunnel:'Portal',door:'Porta',cave:'Caverna',bridge:'Ponte'};
function draw(){document.querySelector('main').replaceChildren();for(const [type,name] of Object.entries(names)){const row=document.createElement('section');row.className='row';const title=document.createElement('h2');title.textContent=name;row.append(title);Buildings3D.styles[type].forEach((name,style)=>{const card=document.createElement('div');card.className='card';const canvas=document.createElement('canvas');canvas.width=460;canvas.height=340;Buildings3D.preview(canvas,type,style,+document.querySelector('select').value<0?style:+document.querySelector('select').value);const label=document.createElement('strong');label.textContent=name;card.append(canvas,label);row.append(card);});document.querySelector('main').append(row);}}
document.querySelector('select').onchange=draw;draw();
</script></html>
